name: shirahsoft_muslim
description: "Al-Quran Portable Module App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  shared_preferences: ^2.5.3
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.5
  get_it: ^9.2.1
  dartz: ^0.10.1
  dio: ^5.9.1
  logger: ^2.6.2
  intl: ^0.20.2
  flutter_screenutil: ^5.9.3
  qcf_quran: ^0.0.5
  flutter_staggered_animations: ^1.1.1
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.1.0
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.12
  audio_video_progress_bar: ^2.0.3
  rxdart: ^0.28.0
  wakelock_plus: ^1.5.1
  bot_toast: ^4.1.3
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^3.1.0
  url_launcher: ^6.3.2
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.6
  isar_community_generator: ^3.3.2
  riverpod_generator: ^4.0.3

flutter:
  generate: false
  uses-material-design: true
  assets:
    - assets/json/
    - assets/images/
    - assets/icons/
    - assets/sounds/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri/Amiri-Italic.ttf
          style: italic
        - asset: assets/fonts/Amiri/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri/Amiri-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo/Cairo-Black.ttf
          weight: 900
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Tajawal/Tajawal-Black.ttf
          weight: 900
    - family: Quran
      fonts:
        - asset: assets/fonts/quran_font/uthmanic_hafs_v20.ttf
    - family: Naskh
      fonts:
        - asset: assets/fonts/naskh/UthmanTN_v2-0.ttf
